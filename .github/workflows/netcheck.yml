name: Netcheck (temporary)
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Supabase endpoints
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          HOST=aws-0-ap-south-1.pooler.supabase.com
          echo "--- DNS ---"
          getent ahosts $HOST | head -5 || echo "no DNS"
          echo "--- TCP 6543 (transaction pooler) ---"
          timeout 20 bash -c "</dev/tcp/$HOST/6543" && echo OPEN || echo "BLOCKED/TIMEOUT"
          echo "--- TCP 5432 (session pooler) ---"
          timeout 20 bash -c "</dev/tcp/$HOST/5432" && echo OPEN || echo "BLOCKED/TIMEOUT"
          echo "--- HTTPS to project (443) ---"
          curl -s -o /dev/null -w "REST %{http_code}\n" -m 20 "$SUPABASE_URL/rest/v1/" || echo "https failed"
          echo "--- runner egress IP ---"
          curl -s -m 20 https://api.ipify.org || true; echo
