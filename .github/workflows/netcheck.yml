name: Netcheck (temporary)
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci
      - name: Probe postgres connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node -e '
          const postgres=require("postgres");
          const u=process.env.DATABASE_URL||"";
          const m=/^postgresql:\/\/([^:]+):([^@]*)@([^:]+):(\d+)\/(.+)$/.exec(u);
          console.log("secret present:", !!u, "len:", u.length);
          if(!m){console.log("PARSE FAILED. starts:", u.slice(0,20));process.exit(1)}
          console.log("user:",m[1],"host:",m[3],"port:",m[4],"db:",m[5],"pwlen:",m[2].length);
          (async()=>{
            for (const opts of [
              {label:"default",       cfg:{prepare:false,connect_timeout:20,max:1}},
              {label:"ssl:require",   cfg:{prepare:false,connect_timeout:20,max:1,ssl:"require"}},
              {label:"ssl:no-verify", cfg:{prepare:false,connect_timeout:20,max:1,ssl:{rejectUnauthorized:false}}},
            ]) {
              const sql=postgres(u,opts.cfg);
              try{ const r=await sql`select 1 as ok`; console.log("✓",opts.label,"->",JSON.stringify(r[0])); await sql.end(); process.exit(0) }
              catch(e){ console.log("✗",opts.label,"->",e.code||"",e.message.slice(0,90)); try{await sql.end({timeout:1})}catch{} }
            }
            process.exit(1)
          })();
          '
