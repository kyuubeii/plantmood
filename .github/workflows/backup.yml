name: Daily backup

# Snapshots the shop (products, prices, content, orders, settings) into the
# private Supabase Storage bucket. Nothing is written back to this repository —
# the repo is public and snapshots contain customer personal data.
on:
  schedule:
    # 18:00 UTC = 02:00 Asia/Kuala_Lumpur — after the shop's day is over.
    - cron: '0 18 * * *'
  workflow_dispatch: {}  # lets you run it by hand from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Take snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run backup
